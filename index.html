<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102a56">
<title>شهرک بازی</title>
<style>
:root{--navy:#102a56;--blue:#2457a6;--gold:#f4bd45;--cream:#fff9e9;--ink:#1d2c45;--green:#16865b;--red:#c34c4c;--purple:#7651a8}
*{box-sizing:border-box}
body{margin:0;padding:14px;background:radial-gradient(circle at top right,#3869ad,#142d58 58%,#0b1a36);font-family:Tahoma,Arial,sans-serif;color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer}
.app{max-width:900px;margin:auto}
header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:#fff;margin:7px 2px 17px}
.brand{font-weight:bold;font-size:20px}.tag{font-size:12px;border:1px solid #ffffff55;border-radius:30px;padding:8px 12px}
.panel{background:var(--cream);border:3px solid var(--gold);border-radius:24px;padding:clamp(17px,4vw,32px);box-shadow:0 18px 48px #0005}
.hero{text-align:center}.heroIcon{font-size:58px}.hero h1{font-size:clamp(25px,5vw,37px);color:var(--navy);margin:5px 0 10px}.desc{color:#5b6980;line-height:2;text-align:center;max-width:650px;margin:0 auto 20px}
h2{color:var(--navy);font-size:21px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.pick{background:#fff;border:2px solid #d9c48c;border-radius:17px;padding:17px 12px;color:var(--navy);font-weight:bold;font-size:18px;text-align:center}
.pick small{display:block;color:#6c7890;font-size:12px;font-weight:normal;margin-top:7px;line-height:1.7}
.mode{background:#fff;border:2px solid #dce3ef;border-radius:17px;padding:17px;text-align:right;color:var(--navy);min-height:115px}
.mode b{display:block;font-size:18px;margin-bottom:7px}.mode span{font-size:13px;line-height:1.8;color:#63718a}
.primary,.secondary{border:0;border-radius:13px;padding:12px 19px;font-weight:bold}
.primary{background:var(--blue);color:#fff}.secondary{background:#fff;border:1px solid #cbd4e2;color:var(--navy)}
.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:#edf2fa;color:var(--navy);padding:9px 13px;border-radius:12px;font-size:13px;font-weight:bold}
.progress{height:9px;background:#e2e8f0;border-radius:20px;overflow:hidden;margin:16px 0 20px}.bar{height:100%;width:0;background:linear-gradient(90deg,#f4bd45,#16865b);transition:.25s}
.instruction{background:#edf3ff;border-right:4px solid var(--blue);padding:12px 14px;border-radius:12px;line-height:1.9;color:#29456f;margin:14px 0}
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:17px 0}
.tile{border:2px solid #d9e0eb;background:#fff;border-radius:15px;padding:16px 10px;min-height:72px;color:#253751;font-weight:bold;line-height:1.7;text-align:center;transition:.15s;user-select:none}
.tile.selected{border-color:var(--blue);background:#eaf1ff;box-shadow:0 0 0 3px #2457a622}
.tile.done{border-color:var(--green);background:#e8f7ef;color:#126342}
.tile.error{border-color:var(--red);background:#fff0ef}
.tile:disabled{cursor:default;opacity:1}
.snakeBoard{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px;margin:15px 0}
.snakeCell{position:relative;min-height:62px;border:1px solid #c7d3e5;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;flex-direction:column;font-weight:bold;color:#27436d;font-size:13px}
.snakeCell:nth-child(4n){background:#eef5ff}
.snakeCell.special{background:#fff3d5;border-color:#e6bd58}
.snakeCell.player{outline:3px solid var(--blue);background:#dce9ff}
.snakeCell small{font-size:10px;color:#65758e;font-weight:normal;margin-top:3px}
.diceArea{display:flex;align-items:center;justify-content:center;gap:14px;margin:15px 0;flex-wrap:wrap}
.die{font-size:44px;background:#fff;border:2px solid #e0c16d;border-radius:14px;padding:7px 15px;min-width:75px;text-align:center}
.feedback{display:none;border-radius:13px;padding:12px 14px;line-height:1.9;margin:13px 0}
.feedback.show{display:block}.good{background:#e7f6ee;color:#126342}.bad{background:#fff0ef;color:#963535}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:15px 0}
.category{border:2px dashed #9aafd0;background:#f5f8ff;border-radius:15px;padding:16px 8px;min-height:70px;color:#244878;font-weight:bold}
.category.active{background:#e7efff;border-color:var(--blue)}
.orderList{display:grid;gap:10px;margin:18px 0}
.orderItem{display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #dce3ed;border-radius:13px;padding:10px}
.orderItem .word{flex:1;font-weight:bold}.orderItem button{border:0;border-radius:9px;background:#edf2fa;color:var(--navy);padding:8px 12px}
.actions{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:18px}
.result{text-align:center}.medal{font-size:65px}.score{font-size:48px;color:var(--blue);font-weight:bold;margin:10px}
.hidden{display:none!important}.note{text-align:center;color:#eaf0fa;font-size:12px;line-height:1.8;margin:14px}
@media(max-width:560px){body{padding:9px}.grid,.board,.categories{grid-template-columns:1fr}.panel{border-radius:19px}.tile{min-height:62px}}
</style>

<style>
body{background:linear-gradient(145deg,#70d7f4 0%,#b5f1d5 42%,#ffe8a6 100%);background-attachment:fixed}
header{color:#12345c}.brand{font-size:22px;text-shadow:0 2px #fff}
.panel{background:#fffdf5;border:4px solid #ffd15b;box-shadow:0 12px 0 #d79b36,0 22px 45px #16406a33}
.heroPoster{width:100%;display:block;border-radius:19px;border:3px solid #f6c64e;box-shadow:0 7px 18px #183c6333;margin-bottom:18px}
.gameCards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;margin-top:16px}
.gameCard{border:0;border-radius:18px;min-height:150px;padding:15px;color:white;text-align:right;box-shadow:0 6px 0 #18314b33,0 10px 18px #18314b22;position:relative;overflow:hidden;transition:transform .16s}
.gameCard:active{transform:translateY(3px);box-shadow:0 3px 0 #18314b33}
.gameCard.locked{filter:saturate(.45);opacity:.88}.gameCard.locked:before{content:"🔒";position:absolute;z-index:2;left:12px;top:10px;background:#102a56dd;border-radius:30px;padding:7px 10px;font-size:17px}
.gameCard .emoji{font-size:38px;display:block;margin-bottom:7px}
.gameCard b{display:block;font-size:17px;text-shadow:0 2px 3px #0004}
.gameCard small{display:block;font-size:12px;line-height:1.7;margin-top:5px;color:#fff}
.gameCard:after{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:#ffffff22;left:-24px;top:-28px}
.gameCard:nth-child(5n+1){background:linear-gradient(135deg,#e85b45,#a92d75)}
.gameCard:nth-child(5n+2){background:linear-gradient(135deg,#20a9a1,#176b94)}
.gameCard:nth-child(5n+3){background:linear-gradient(135deg,#9360cf,#503b9b)}
.gameCard:nth-child(5n+4){background:linear-gradient(135deg,#e5a22a,#c85b24)}
.gameCard:nth-child(5n){background:linear-gradient(135deg,#56a94d,#167b64)}
.sectionTitle{color:#183b6b;text-align:center;font-size:22px;margin:18px 0 8px}
.stars{display:flex;justify-content:center;gap:7px;margin:12px 0;color:#f0ad24;font-size:22px}
.gameStage{background:linear-gradient(135deg,#f0f7ff,#fff);border:2px solid #d7e5f7;border-radius:18px;padding:15px;margin:12px 0}
.bigEmoji{text-align:center;font-size:52px;margin:8px}
.playChoice{background:#fff;border:2px solid #cbd9ec;border-radius:14px;padding:13px;margin:7px 0;width:100%;text-align:center;color:#23436b;font-weight:bold}
.playChoice:hover{background:#edf5ff;border-color:#5e9ee4}
.memoryGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.memoryCard{min-height:76px;border:2px solid #b9cce6;border-radius:14px;background:linear-gradient(145deg,#e9f4ff,#fff);font-size:24px;color:#24456c}
.memoryCard.open{background:#fff3c7;border-color:#e7b84a}
.mazeGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;max-width:330px;margin:12px auto}
.mazeCell{aspect-ratio:1;border-radius:8px;background:#e8f0fa;display:grid;place-items:center;font-size:22px}
.mazeCell.wall{background:#345b84}.mazeCell.player{background:#ffdc77}.mazeCell.goal{background:#b9edc9}
@media(max-width:560px){.gameCards{grid-template-columns:1fr}.gameCard{min-height:118px}.panel{padding:13px}}
</style>

<style>
#home{padding:0!important}
.posterWrap{position:relative;width:100%;line-height:0}
.heroPoster{width:100%;display:block;margin:0;border:0;border-radius:17px;box-shadow:none}
.posterEnter{position:absolute;left:50%;bottom:5.1%;transform:translateX(-50%);min-width:clamp(105px,24%,220px);padding:clamp(9px,1.7vw,16px) 24px;border:3px solid #fff3a8;border-radius:999px;background:linear-gradient(135deg,#ffcf35,#ff7a00 55%,#ed2c91);color:#fff;font-weight:900;font-size:clamp(17px,2.5vw,27px);line-height:1.2;text-shadow:0 2px 4px #70205c;box-shadow:0 0 0 4px #9a36d9aa,0 5px 0 #7a2b9a,0 0 22px #ffeb55;z-index:3;animation:entryBlink 1.05s infinite ease-in-out}
@keyframes entryBlink{0%,100%{opacity:1;filter:brightness(1);box-shadow:0 0 0 4px #9a36d9aa,0 5px 0 #7a2b9a,0 0 22px #ffeb55}50%{opacity:.62;filter:brightness(1.35);box-shadow:0 0 0 7px #f34bca88,0 5px 0 #7a2b9a,0 0 34px #fff36b}}
@media(prefers-reduced-motion:reduce){.posterEnter{animation:none}}
</style>
</head>

 let area=document.getElementById("playArea");area.innerHTML="";document.getElementById("roundPill").textContent="مرحله "+fa(advStep+1);document.getElementById("bar").style.width=(advStep/3*100)+"%";document.getElementById("continue").disabled=true;document.getElementById("continue").onclick=advance;document.getElementById("feedback").className="feedback";
 let titles={escape:"قفل آزمایشگاه را باز کن",lab:"آزمایشگاه آماده است",detective:"سرنخ را پیدا کن",puzzle:"پازل دانشی",maze:"به خروجی هزارتو برس",eco:"زمین را نجات بده",memory:"کارت‌های همسان را پیدا کن",build:"ماشین علمی را بساز",food:"زنجیره غذایی را کامل کن",race:"مسابقه علمی"};
 prompt(titles[advMode]+"؛ هر مرحله را با دقت انجام بده.");
 if(["escape","lab","detective","eco","race"].includes(advMode))renderChoiceAdventure(area);
 else if(advMode==="memory")renderMemory(area);
 else if(advMode==="puzzle")renderTextPuzzle(area);
 else if(advMode==="maze")renderMaze(area);
 else if(advMode==="build")renderBuild(area);
 else if(advMode==="food")renderFood(area);
}
function renderChoiceAdventure(area){
 let qset=adventureData[grade][advMode],q=qset[advStep%qset.length];let box=document.createElement("div");box.className="gameStage";box.innerHTML='<div class="bigEmoji">'+({escape:"🚪🔐",lab:"🧪🔬",detective:"🕵️🔎",eco:"🌍🌱",race:"🏁"})[advMode]+'</div><h2 style="text-align:center">'+q[0]+'</h2>';area.appendChild(box);
 q[1].forEach((opt,i)=>{let b=document.createElement("button");b.className="playChoice";b.textContent=opt;b.onclick=()=>{[...area.querySelectorAll("button")].forEach(x=>x.disabled=true);if(i===q[2]){advPoints+=10;feedback(true,"آفرین! درست پیدا کردی. ⭐");}else feedback(false,"این گزینه درست نیست؛ پاسخ درست: "+q[1][q[2]]);advStep++;if(advStep>=qset.length)adventureDone("مأموریت را به پایان رساندی! امتیازت "+fa(advPoints)+" است.");else document.getElementById("continue").disabled=false;};area.appendChild(b)});
}
function renderMemory(area){
 prompt("کارت‌ها را برگردان و دو تصویر مرتبط را پیدا کن.");
 let pairs=[["🌱","ریشه"],["🫀","قلب"],["🌡️","دماسنج"]];let cards=pairs.flatMap((p,i)=>[{v:p[0],id:i},{v:p[1],id:i}]).sort(()=>Math.random()-.5);let grid=document.createElement("div");grid.className="memoryGrid";area.appendChild(grid);let first=null,matched=0;
 cards.forEach(c=>{let b=document.createElement("button");b.className="memoryCard";b.textContent="❔";b.onclick=()=>{if(b.disabled||b===first)return;b.textContent=c.v;b.classList.add("open");if(!first){first={b,c};return}if(first.c.id===c.id){first.b.disabled=true;b.disabled=true;matched++;first=null;if(matched===3){advPoints=30;adventureDone("همه جفت‌ها را پیدا کردی! حافظه‌ات عالی است.");}}else{let prev=first.b;first=null;setTimeout(()=>{prev.textContent="❔";b.textContent="❔";prev.classList.remove("open");b.classList.remove("open")},650)}};grid.appendChild(b)});
}
function renderTextPuzzle(area){
 let pieces=["☀️ خورشید","🌧️ باران","🌱 گیاه","🌈 رنگین‌کمان"];let shuffled=[...pieces].sort(()=>Math.random()-.5);let box=document.createElement("div");box.className="gameStage";box.innerHTML='<div class="bigEmoji">🌦️</div><h2>چرخه طبیعت را به ترتیب بچین</h2><p>کارت‌ها را با دکمه‌های بالا و پایین مرتب کن.</p>';area.appendChild(box);let list=document.createElement("div");list.className="orderList";area.appendChild(list);
 function draw(){list.innerHTML="";shuffled.forEach((v,i)=>{let r=document.createElement("div");r.className="orderItem";r.innerHTML='<span class="word">'+v+'</span>';[-1,1].forEach(d=>{let b=document.createElement("button");b.textContent=d<0?"↑":"↓";b.disabled=i+d<0||i+d>=shuffled.length;b.onclick=()=>{[shuffled[i],shuffled[i+d]]=[shuffled[i+d],shuffled[i]];draw()};r.appendChild(b)});list.appendChild(r)})}
 draw();let check=document.createElement("button");check.className="primary";check.textContent="بررسی پازل";check.onclick=()=>{advPoints=shuffled[0]===pieces[0]?20:0;adventureDone(advPoints?"پازل را درست چیدی!":"ترتیب کامل نبود؛ دوباره تمرین کن.")};area.appendChild(check);
}
function renderMaze(area){
 prompt("با انتخاب خانه‌های مجاور، از نقطه شروع به پرچم برس.");
 let map=["S....",".##..","...#.","##...","....G"];let pos=0;let grid=document.createElement("div");grid.className="mazeGrid";area.appendChild(grid);
 map.join("").split("").forEach((ch,i)=>{let c=document.createElement("button");c.className="mazeCell"+(ch==="#"?" wall":"")+(i===0?" player":"")+(ch==="G"?" goal":"");c.textContent=ch==="#"?"🪨":ch==="G"?"🏁":i===0?"🧑":"·";c.disabled=ch==="#";c.onclick=()=>{if(Math.abs(Math.floor(i/5)-Math.floor(pos/5))+Math.abs(i%5-pos%5)!==1)return;pos=i;[...grid.children].forEach((x,j)=>{x.classList.toggle("player",j===pos);if(j===pos)x.textContent="🧑";else x.textContent=map[Math.floor(j/5)][j%5]==="#"?"🪨":map[Math.floor(j/5)][j%5]==="G"?"🏁":"·"});if(pos===24){advPoints=30;adventureDone("از هزارتو خارج شدی! آفرین.")}};grid.appendChild(c)});
}
function renderBuild(area){
 let items=["⚙️ چرخ‌دنده","🔗 اتصال قطعات","💡 روشن شدن چراغ"];let seq=[...items].sort(()=>Math.random()-.5);let list=document.createElement("div");list.className="orderList";area.appendChild(list);
 seq.forEach((x,i)=>{let b=document.createElement("div");b.className="orderItem";b.innerHTML='<span class="word">'+x+'</span>';let up=document.createElement("button");up.textContent="↑";up.onclick=()=>{if(i>0){[seq[i],seq[i-1]]=[seq[i-1],seq[i]];renderAdventure()}};b.appendChild(up);list.appendChild(b)});
 let c=document.createElement("button");c.className="primary";c.textContent="راه‌اندازی ماشین";c.onclick=()=>{advPoints=seq[0]===items[0]?30:0;adventureDone(advPoints?"ماشین را درست ساختی!":"قطعات هنوز به ترتیب درست نیستند.")};area.appendChild(c);
}
function renderFood(area){
 let order=["🌿 گیاه","🐇 خرگوش","🦊 روباه"];let shuffled=[...order].sort(()=>Math.random()-.5);let list=document.createElement("div");list.className="orderList";area.appendChild(list);
 shuffled.forEach((x,i)=>{let r=document.createElement("div");r.className="orderItem";r.innerHTML='<span class="word">'+x+'</span>';let b=document.createElement("button");b.textContent="↑";b.onclick=()=>{if(i>0){[shuffled[i],shuffled[i-1]]=[shuffled[i-1],shuffled[i]];renderAdventure()}};r.appendChild(b);list.appendChild(r)});
 let check=document.createElement("button");check.className="primary";check.textContent="بررسی زنجیره";check.onclick=()=>{advPoints=shuffled.join("")===order.join("")?30:0;adventureDone(advPoints?"زنجیره غذایی را درست ساختی!":"از تولیدکننده شروع کن و سپس گیاه‌خوار و گوشت‌خوار را قرار بده.")};area.appendChild(check);
}
function advance(){if(round<rounds.length-1){round++;loadRound()}else finish()}
function finish(){show("result");document.getElementById("bar").style.width="100%";document.getElementById("finalScore").textContent=fa(score)+" امتیاز";document.getElementById("medal").textContent=score>=90?"🏆":score>=60?"🥇":"🌱";document.getElementById("resultText").textContent=score>=90?"درخشان بود! معماها را مثل یک دانشمند واقعی حل کردی.":score>=60?"آفرین! مهارت حل معمای علمی‌ات خوب است؛ با تمرین بهتر هم می‌شوی.":"تلاش خوبی بود. دوباره بازی کن و راه‌حل‌ها را کشف کن."}

</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style id="shahrak-access-style-v1">
#shahrakAccessStatus{margin:12px 0 16px;text-align:center;font-weight:800}
.gameCard.locked{position:relative;filter:saturate(.42);opacity:.9}
.gameCard.locked:before{content:"🔒";position:absolute;z-index:3;left:12px;top:10px;background:#102a56eF;color:#fff;border:1px solid #ffffff88;border-radius:30px;padding:7px 10px;font-size:18px;box-shadow:0 3px 9px #0003}

.gameCard:focus-visible{outline:4px solid #102a56;outline-offset:3px}

<script id="shahrak-access-logic-v1">
(function(){
 'use strict';
 const SUPABASE_URL='https://vsoovwohqwhhwtwkyrpy.supabase.co';
 const SUPABASE_ANON_KEY='sb_publishable_--MkDj-tlGDyrRGzpGcgRg_XxjLhWB-';
 const ACADEMY_ORIGIN='https://academybazi.github.io';
 const GAME_IDS=['escape','lab','detective','puzzle','maze','eco','memory','build','food','race','snake','mix'];
 let gameDb=null,gameReady=false,gameProfile=null,accessStatus=null,refreshing=null;
 const statusEl=()=>document.getElementById('shahrakAccessStatus');
 function setStatus(message,isError=false){const el=statusEl();if(el){el.textContent=message;el.style.background=isError?'#fff0ef':'#edf3ff';el.style.color=isError?'#963535':'#29456f';}}
 function faNum(n){return new Intl.NumberFormat('fa-IR').format(Number(n)||0)}
 function initClient(){
  if(gameDb)return gameDb;
  if(!window.supabase)throw new Error('کتابخانهٔ اتصال به پایگاه داده بارگذاری نشد.');
  gameDb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
  return gameDb;
 }
 async function readStatus(){
  const client=initClient();
  const {data,error}=await client.rpc('shahrak_get_daily_game_status');
  if(error)throw error;
  if(!data||data.ok===false)throw new Error(data&&data.error||'اطلاعات حساب دانش‌آموز دریافت نشد.');
  accessStatus=data;return data;
 }
 function drawLocks(){
  const cards=[...document.querySelectorAll('#modes .gameCard')];
  if(!cards.length)return;
  const isAllowed=!!(accessStatus&&(accessStatus.is_explorer||accessStatus.is_admin));
  const chosen=accessStatus&&accessStatus.played_game_id?String(accessStatus.played_game_id):'';
  cards.forEach(card=>{
   const match=(card.getAttribute('onclick')||'').match(/startMode\('([^']+)'\)/);
   const id=match?match[1]:'';
   const unlocked=isAllowed&&(!chosen||chosen===id);
   card.classList.toggle('locked',!unlocked);
   card.setAttribute('aria-disabled',unlocked?'false':'true');
   card.dataset.gameId=id;
  });
  if(!isAllowed){
   setStatus('شما باید برای بازی به سطح کاوشگر برسید.');
  }else if(accessStatus.is_admin){
   setStatus('دسترسی مدیر فعال است؛ می‌توانید بازی‌ها را انتخاب کنید.');
  }else if(!chosen){
   setStatus('به سطح کاوشگر رسیده‌ای! امروز یک بازی دلخواه انتخاب کن؛ پس از انتخاب، بقیهٔ بازی‌ها تا فردا قفل می‌شوند.');
  }else{
   setStatus('بازی امروز شما انتخاب شده است؛ فقط همین بازی تا پایان امروز باز است. فردا می‌توانید بازی دیگری انتخاب کنید.');
  }
 }
 async function refreshAccess(){
  if(refreshing)return refreshing;
  refreshing=(async()=>{const s=await readStatus();drawLocks();return s})();
  try{return await refreshing}finally{refreshing=null}
 }
 async function resumeExistingSession(){
  try{
   const client=initClient();
   const {data,error}=await client.auth.getSession();if(error)throw error;
   if(!data||!data.session)return false;
   const saved=sessionStorage.getItem('shahrak_student_profile_v1');
   gameProfile=saved?JSON.parse(saved):null;
   if(!gameProfile||!gameProfile.id)return false;
   gameReady=true;await refreshAccess();return true;
  }catch(error){console.warn('Shahrak session resume failed:',error);return false;}
 }
 async function requestAcademyHandoff(){
  const params=new URLSearchParams(location.search),nonce=params.get('shahrak_handoff');
  if(!nonce||!window.opener)return false;
  return new Promise((resolve)=>{
   let settled=false;
   const finish=(value)=>{if(settled)return;settled=true;clearTimeout(timer);window.removeEventListener('message',listener);resolve(value)};
   const listener=async(event)=>{
    if((event.origin!==ACADEMY_ORIGIN&&event.origin!=='null')||event.source!==window.opener)return;
    const msg=event.data;if(!msg||msg.type!=='SHAHRAK_HANDOFF_RESPONSE'||msg.nonce!==nonce)return;
    if(!msg.ok||!msg.payload||!msg.payload.session||!msg.payload.profile){setStatus(msg.error||'انتقال اطلاعات ورود از آکادمی ناموفق بود.',true);finish(false);return;}
    try{
     const client=initClient();
     const {error}=await client.auth.setSession({access_token:msg.payload.session.access_token,refresh_token:msg.payload.session.refresh_token});
     if(error)throw error;
     gameProfile=msg.payload.profile;
     sessionStorage.setItem('shahrak_student_profile_v1',JSON.stringify(gameProfile));
     gameReady=true;
     history.replaceState({},document.title,location.pathname);
     await refreshAccess();
     finish(true);
    }catch(error){setStatus('ورود به شهرک بازی ناموفق بود: '+(error.message||'خطای نامشخص'),true);finish(false);}
   };
   const timer=setTimeout(()=>{setStatus('پاسخ آکادمی دریافت نشد. از صفحهٔ آکادمی دوباره وارد شهرک بازی شوید.',true);finish(false)},15000);
   window.addEventListener('message',listener);
   try{window.opener.postMessage({type:'SHAHRAK_HANDOFF_REQUEST',nonce},'*')}catch(error){setStatus('ارتباط با آکادمی برقرار نشد.',true);finish(false)}
  });
 }
 window.openAccess=async function(){
  if(!gameReady){await requestAcademyHandoff();if(!gameReady)await resumeExistingSession();}
  if(!gameReady){setStatus('برای ورود به شهرک بازی، ابتدا از طریق حساب دانش‌آموزی آکادمی وارد شوید.',true);alert('ابتدا از طریق آکادمی وارد حساب دانش‌آموزی خود شوید.');return;}
  try{await refreshAccess();show('modes')}catch(error){setStatus('بررسی مجوز بازی ناموفق بود: '+(error.message||'خطای نامشخص'),true);alert('فعلاً امکان بررسی مجوز بازی وجود ندارد. لطفاً دوباره تلاش کنید.');}
 };
 window.showModes=function(){show('modes');drawLocks()};
 const originalStartMode=window.startMode;
 window.startMode=async function(gameId){
  if(!GAME_IDS.includes(gameId))return;
  if(!gameReady){alert('ابتدا از طریق آکادمی وارد حساب دانش‌آموزی خود شوید.');return;}
  try{
   const s=await refreshAccess();
   if(!s.is_explorer&&!s.is_admin){alert('شما باید برای بازی به سطح کاوشگر برسید.');setStatus('شما باید برای بازی به سطح کاوشگر برسید.',true);return;}
   if(!s.is_admin&&s.played_game_id&&String(s.played_game_id)!==gameId){alert('سهمیهٔ بازی امروز استفاده شده است. فردا می‌توانید یک بازی دیگر انتخاب کنید.');return;}
   const {data,error}=await gameDb.rpc('shahrak_claim_daily_game',{p_game_id:gameId});
   if(error)throw error;
   if(!data||!data.ok){
    if(data&&data.reason==='level_required'){accessStatus={...s,is_explorer:false};drawLocks();alert('شما باید برای بازی به سطح کاوشگر برسید.');return;}
    if(data&&data.reason==='daily_limit'){accessStatus={...s,played_game_id:data.played_game_id||s.played_game_id};drawLocks();alert('سهمیهٔ بازی امروز استفاده شده است. فردا می‌توانید یک بازی دیگر انتخاب کنید.');return;}
    throw new Error(data&&data.error||'مجوز باز کردن بازی صادر نشد.');
   }
   await refreshAccess();
   originalStartMode(gameId);
  }catch(error){console.error('Shahrak game access denied:',error);alert('بررسی مجوز بازی انجام نشد. لطفاً اتصال اینترنت را بررسی کنید.');setStatus('بررسی مجوز بازی ناموفق بود؛ تا تأیید سرور بازی باز نمی‌شود.',true);}
 };
 async function boot(){
  try{
   initClient();
   // انتقال نشست فقط پس از کلیک دانش‌آموز روی «ورود» انجام می‌شود؛
   // تا درخواست اولیهٔ صفحه، مجوز یک‌بارمصرف آکادمی را مصرف نکند.
   const resumed=await resumeExistingSession();
   if(!resumed){setStatus('برای ورود به شهرک بازی، ابتدا از طریق آکادمی وارد شوید.');return;}
   await refreshAccess();
  }catch(error){setStatus('اتصال به سامانهٔ مجوز بازی برقرار نشد. ابتدا تنظیمات پایگاه داده را اجرا کنید.',true);console.error(error)}
 }
 boot();
})();
